<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>

    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />

    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <script type="module" src="map.js"></script>
  </head>

  <body>
    <header>
      <h1>🚴🏼‍♀️ Bikewatching</h1>

      <label>
        Filter by time:
        <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
      </label>

      <div>
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
      </div>
    </header>

    <!-- MAP -->
    <div id="map">
      <svg></svg>
    </div>

    <div class="legend">
  <div class="legend-title">Legend:</div>

  <div class="legend-item" style="--departure-ratio: 1">
    More departures
  </div>

  <div class="legend-item" style="--departure-ratio: 0.5">
    Balanced
  </div>

  <div class="legend-item" style="--departure-ratio: 0">
    More arrivals
  </div>
</div>
  </body>
</html>
